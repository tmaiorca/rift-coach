[package]
name = "rc-vision"
description = "Game-window capture for post-game vision review: frames on disk, downscale + JPEG, moment selection"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jpeg-encoder = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
