[package]
name = "rc-ai"
description = "Pluggable LLM providers (Anthropic, OpenAI, Gemini, OpenAI-compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
rc-common = { version = "0.2.1", path = "../common" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"
