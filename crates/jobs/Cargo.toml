[package]
name = "rc-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rc-coach = { version = "0.2.1", path = "../coach" }
rc-common = { version = "0.2.1", path = "../common" }
rc-ddragon = { version = "0.2.1", path = "../ddragon" }
rc-live = { version = "0.2.1", path = "../live" }
rc-metrics = { version = "0.2.1", path = "../metrics" }
rc-riot = { version = "0.2.1", path = "../riot" }
rc-store = { version = "0.2.1", path = "../store" }
rc-vision = { version = "0.2.1", path = "../vision" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
rc-ai = { version = "0.2.1", path = "../ai" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"
