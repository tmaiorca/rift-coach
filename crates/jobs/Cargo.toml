[package]
name = "rc-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rc-common = { version = "0.1.0", path = "../common" }
rc-ddragon = { version = "0.1.0", path = "../ddragon" }
rc-riot = { version = "0.1.0", path = "../riot" }
rc-store = { version = "0.1.0", path = "../store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"
