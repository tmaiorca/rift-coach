[package]
name = "rc-live"
description = "Live Client Data API client (own numbers only), game tracker, live view math, footprint sampler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rc-metrics = { version = "0.1.0", path = "../metrics" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"

[lints]
workspace = true
