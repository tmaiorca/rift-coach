[package]
name = "rc-coach"
description = "Match analysis views, AI facts, report generation and validation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rc-ai = { version = "0.1.0", path = "../ai" }
rc-common = { version = "0.1.0", path = "../common" }
rc-metrics = { version = "0.1.0", path = "../metrics" }
rc-store = { version = "0.1.0", path = "../store" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"
