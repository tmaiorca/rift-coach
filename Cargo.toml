[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/riot",
    "crates/store",
    "crates/ddragon",
    "crates/metrics",
    "crates/ai",
    "crates/signals",
    "crates/coach",
    "crates/jobs",
    "cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Smaller dev builds: line tables are enough for backtraces, and dependencies
# don't need debug info (keeps target/ from growing to tens of GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
